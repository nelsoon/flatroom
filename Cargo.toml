[package]
name = "flatroom"
version = "0.1.0"
edition = "2021"
description = "Independent open tool to summarize your own calibration export files (clean-room, no vendor code)."
license = "MIT"

[[bin]]
name = "flatroom"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
